<!doctype html>
<!-- login.html: log-in screen (task P2-S6).
     Purpose: POST /api/v1/auth/login and keep the token in this browser tab's
     sessionStorage (the server keeps no session). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Plan B Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html">Plan B Studio</a>
  <a href="register.html">Register</a>
  <a href="login.html">Log in</a>
  <a href="members.html">Members</a>
  <a href="decisions.html">Decisions</a>
  <a href="#" id="logout" hidden>Log out</a>
  <span class="who" id="who"></span>
</nav>
<main>
<h1>Log in</h1>
<form class="stack" id="form">
  <label>Email <input type="email" name="email" autocomplete="email" required></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<p>No account yet? <a href="register.html">Register</a>.</p>
</main>
<script src="common.js"></script>
<script>
setupNav();
const form = document.getElementById("form");
const msg = document.getElementById("msg");
form.addEventListener("submit", async function (event) {
  event.preventDefault();
  showMessage(msg, "Logging in...", "");
  const data = new FormData(form);
  const result = await api("POST", "/auth/login", { email: data.get("email"), password: data.get("password") });
  if (result.ok) {
    setToken(result.data.access_token);
    window.location.href = "members.html";
  } else {
    showMessage(msg, errorText(result), "error");
  }
});
</script>
</body>
</html>
